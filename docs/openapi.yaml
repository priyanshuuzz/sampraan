openapi: 3.0.3
info:
  title: SAMPRAAN Trust Fabric API
  version: 0.1.0
  description: Platform-compatible API contract for the SAMPRAAN backend foundation. Domain calls are currently exposed as typed tRPC procedures under /api/trpc.
servers:
  - url: /
paths:
  /health:
    get:
      summary: API, database, and blockchain adapter status
      responses:
        '200':
          description: Health status
  /ready:
    get:
      summary: Readiness status
      responses:
        '200':
          description: Ready
        '503':
          description: Database is not ready
  /api/trpc/identities.list:
    get:
      summary: List identities
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Typed identity list }
        '401': { description: Authentication required }
  /api/trpc/identities.create:
    post:
      summary: Create an identity
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityInput'
      responses:
        '200': { description: Identity created }
        '400': { description: Validation failure }
        '401': { description: Authentication required }
  /api/trpc/assets.list:
    get:
      summary: List controlled assets
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Typed asset list }
        '401': { description: Authentication required }
  /api/trpc/assets.authorizeTransfer:
    post:
      summary: Evaluate a protected asset transfer
      description: The backend resolves the authenticated actor, evaluates policy, records the decision and audit event, and submits the custody transfer to the permissioned Besu chain after ALLOW. The smart contract independently re-verifies role, identity status, and asset state; on-chain success attaches transactionHash/blockNumber/blockHash evidence to the audit event, and a chain rejection records BLOCKCHAIN_TRANSACTION_FAILED without claiming success.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      responses:
        '200': { description: ALLOW, DENY, or CHALLENGE decision }
        '401': { description: Authentication required }
        '429': { description: Rate limited }
  /api/trpc/audit.list:
    get:
      summary: List application audit read-model events
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Audit events }
  /api/trpc/alerts.list:
    get:
      summary: List security alerts
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Security alerts }
  /api/trpc/blockchain.status:
    get:
      summary: Read blockchain adapter status (BESU or MOCK)
      responses:
        '200': { description: Network status with mode, chainId, latestBlock, nodeVersion }
  /api/trpc/blockchain.latestBlock:
    get:
      summary: Read the latest chain block number
      responses:
        '200': { description: Block number }
  /api/trpc/blockchain.transaction:
    get:
      summary: Retrieve transaction evidence by hash
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: input
          required: true
          schema:
            type: object
            required: [transactionHash]
            properties:
              transactionHash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
      responses:
        '200': { description: Transaction evidence (hash, blockNumber, blockHash, status, events) }
  /api/trpc/blockchain.events:
    get:
      summary: Read recent SAMPRAAN contract events
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Parsed chain events }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: manus_session
  schemas:
    IdentityInput:
      type: object
      required: [displayName, organization, did]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 160 }
        organization: { type: string, minLength: 2, maxLength: 180 }
        did: { type: string, minLength: 8, maxLength: 255 }
        status: { type: string, enum: [ACTIVE, REVOKED, SUSPENDED] }
    TransferInput:
      type: object
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
        assetClassification: { type: string }
        stepUpAuthenticated: { type: boolean, default: false }
