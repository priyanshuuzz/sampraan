# SAMPRAAN pnpm workspace configuration.
#
# BUG-024 (QA finding #8): pnpm 10 no longer reads the "pnpm" field from
# package.json — patchedDependencies and overrides were silently ignored,
# which meant this wouter patch was NEVER applied in this project. pnpm 10
# only reads these keys from pnpm-workspace.yaml.
packages:
  - .

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  tailwindcss>nanoid: 3.3.7
  # Security overrides (pnpm audit): force patched transitive versions.
  # lodash/lodash-es >=4.18.0 fix the _.template code-injection advisory
  # (GHSA-x4vx-rjvf-j5p4) pulled in via recharts (chart rendering) and
  # streamdown>mermaid (markdown rendering); both are client-side and
  # never pass untrusted input to _.template, but patch anyway.
  lodash: 4.18.1
  lodash-es: 4.18.1
